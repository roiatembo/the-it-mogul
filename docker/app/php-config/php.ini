; PHP configuration for the IT Mogul local development environment.

memory_limit = 2G
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120

; Xdebug
xdebug.mode = debug
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = wordpress
